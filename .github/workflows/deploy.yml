name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Work out the base path
        id: paths
        run: |
          # A project repo is served from /<repo>; a <user>.github.io repo is
          # served from the root and must have no prefix at all.
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
            echo "site=https://$OWNER.github.io/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.site }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
